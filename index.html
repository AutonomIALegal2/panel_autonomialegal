<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Panel AutonomIA — Prospección</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <script>
      /* tema antes del primer render, para no parpadear */
      try {
        var t = JSON.parse(localStorage.getItem('panel-config') || '{}').theme;
        document.documentElement.dataset.ptheme = t === 'light' ? 'light' : 'dark';
      } catch (e) { document.documentElement.dataset.ptheme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app/main.jsx"></script>
  </body>
</html>
